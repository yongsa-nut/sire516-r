<text x="598" y="78" text-anchor="start" fill="#333333" font-size="10.5" font-family="Consolas, Menlo, monospace" font-weight="normal">library size</text>
<text x="598" y="92" text-anchor="start" fill="#777777" font-size="10.5" font-family="Helvetica, Arial, sans-serif" font-weight="normal">= all its genes added up</text>
<text x="68" y="134" text-anchor="middle" fill="#777777" font-size="10.5" font-family="Helvetica, Arial, sans-serif" font-weight="normal">one sample:</text>
<text x="68" y="148" text-anchor="middle" fill="#777777" font-size="10.5" font-family="Helvetica, Arial, sans-serif" font-weight="normal">cells in a tube</text>
<text x="210" y="134" text-anchor="middle" fill="#777777" font-size="10.5" font-family="Helvetica, Arial, sans-serif" font-weight="normal">their RNA</text>
<text x="340" y="134" text-anchor="middle" fill="#777777" font-size="10.5" font-family="Helvetica, Arial, sans-serif" font-weight="normal">chopped into fragments</text>
<text x="340" y="148" text-anchor="middle" fill="#777777" font-size="10.5" font-family="Helvetica, Arial, sans-serif" font-weight="normal">and read — RNA-seq</text>
<text x="500" y="134" text-anchor="middle" fill="#777777" font-size="10.5" font-family="Helvetica, Arial, sans-serif" font-weight="normal">count per gene:</text>
<text x="500" y="148" text-anchor="middle" fill="#777777" font-size="10.5" font-family="Helvetica, Arial, sans-serif" font-weight="normal">fragments that came from it</text>
<text x="40" y="172" text-anchor="start" fill="#777777" font-size="10.5" font-family="Helvetica, Arial, sans-serif" font-weight="normal">one tube of cells, sequenced twice — B read twice as deep:</text>
