<svg xmlns="http://www.w3.org/2000/svg" width="800" height="236" viewBox="0 0 800 236" font-family="Helvetica, Arial, sans-serif" font-size="13">
<path d="M 710 42 V 18 H 110 V 34" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="110,42 106,34 114,34" fill="#333333"/>
<text x="410" y="13" text-anchor="middle" fill="#777777" font-size="11" font-family="Helvetica, Arial, sans-serif" font-weight="normal">the next question</text>
<rect x="30" y="44" width="160" height="92" rx="8" ry="8" fill="#dbe9f6" stroke="#bbbbbb" stroke-width="1"/>
<text x="110" y="63" text-anchor="middle" fill="#2f6f9f" font-size="11" font-family="Helvetica, Arial, sans-serif" font-weight="bold">look</text>
<text x="110" y="82" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">two genes: 92% of all counts</text>
<text x="110" y="96" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">Control was read deepest</text>
<text x="110" y="110" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">the counts are raw</text>
<line x1="193" y1="90" x2="221" y2="90" stroke="#333333" stroke-width="1.5"/>
<polygon points="227,90 219,86 219,94" fill="#333333"/>
<rect x="230" y="44" width="160" height="92" rx="8" ry="8" fill="#dbe9f6" stroke="#bbbbbb" stroke-width="1"/>
<text x="310" y="63" text-anchor="middle" fill="#2f6f9f" font-size="11" font-family="Helvetica, Arial, sans-serif" font-weight="bold">ask</text>
<text x="310" y="82" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">which treatment has the</text>
<text x="310" y="96" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">highest expression?</text>
<text x="310" y="110" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">expression of what? raw?</text>
<line x1="393" y1="90" x2="421" y2="90" stroke="#333333" stroke-width="1.5"/>
<polygon points="427,90 419,86 419,94" fill="#333333"/>
<rect x="430" y="44" width="160" height="92" rx="8" ry="8" fill="#dbe9f6" stroke="#bbbbbb" stroke-width="1"/>
<text x="510" y="63" text-anchor="middle" fill="#2f6f9f" font-size="11" font-family="Helvetica, Arial, sans-serif" font-weight="bold">read</text>
<text x="510" y="82" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">it chose "mean raw count"</text>
<text x="510" y="96" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">its table = depth ÷ 12</text>
<text x="510" y="110" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">the caveat came last</text>
<line x1="593" y1="90" x2="621" y2="90" stroke="#333333" stroke-width="1.5"/>
<polygon points="627,90 619,86 619,94" fill="#333333"/>
<rect x="630" y="44" width="160" height="92" rx="8" ry="8" fill="#dbe9f6" stroke="#bbbbbb" stroke-width="1"/>
<text x="710" y="63" text-anchor="middle" fill="#2f6f9f" font-size="11" font-family="Helvetica, Arial, sans-serif" font-weight="bold">look again</text>
<text x="710" y="82" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">normalise, then per gene</text>
<text x="710" y="96" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">TFF1 falls under OHT</text>
<text x="710" y="110" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">is it the same at 48h?</text>
<line x1="410" y1="97" x2="410" y2="160" stroke="#777777" stroke-width="1"/>
<rect x="300" y="162" width="220" height="62" rx="8" ry="8" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1"/>
<text x="410" y="181" text-anchor="middle" fill="#333333" font-size="11" font-family="Helvetica, Arial, sans-serif" font-weight="bold">the tool</text>
<text x="410" y="200" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">answers, and writes the code</text>
<text x="410" y="214" text-anchor="middle" fill="#777777" font-size="10" font-family="Helvetica, Arial, sans-serif" font-weight="normal">in fourteen seconds</text>
</svg>
